# Basic abuse protection: ~1 request/second per IP, bursts of 20 allowed.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

server {
    listen 80;
    server_name _;

    # Must be >= MAX_UPLOAD_MB in the backend env. Nginx's default is 1 MB,
    # which would reject most phone/camera photos with HTTP 413.
    client_max_body_size 12m;

    root /usr/share/nginx/html;
    index index.html;

    # /api/predict -> http://backend:8000/predict  (the trailing slash strips /api)
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Grad-CAM / first model load on CPU can be slow.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # React Router: any other path serves the SPA, so refreshing /history etc. works.
    location / {
        try_files $uri /index.html;
    }
}
